<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pulse">
<meta name="theme-color" content="#0a0a0f">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="robots" content="noindex,nofollow">
<title>Pulse — creative GPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f;--panel:#12121a;--elev:#1a1a24;--line:#2a2a38;
  --text:#f4f2ff;--muted:#8b87a0;--accent:#a78bfa;--accent2:#22d3ee;
  --hot:#fb7185;--ok:#34d399;--user:#1e1b2e;
  --font:"Instrument Sans",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
  --nav:calc(58px + env(safe-area-inset-bottom));
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--font);overscroll-behavior:none}
body{padding-top:env(safe-area-inset-top)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--accent2)}
#lock{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-content:center;padding:28px;gap:16px;text-align:center}
#lock .mark{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-content:center;font-size:32px;font-weight:700;margin:0 auto;color:#0a0a0f}
#lock h1{margin:0;font-size:36px;letter-spacing:-.04em}
#lock p{margin:0;color:var(--muted);max-width:260px;justify-self:center}
#lock input{width:min(280px,100%);justify-self:center;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:17px}
#lock input:focus{outline:2px solid var(--accent);outline-offset:1px}
#lock .btn{width:min(280px,100%);justify-self:center}
.shell{position:fixed;inset:env(safe-area-inset-top) 0 0 0;display:flex;flex-direction:column}
header{flex:0 0 auto;padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);background:rgba(10,10,15,.85);backdrop-filter:blur(12px);z-index:5}
header .brand{display:flex;align-items:center;gap:10px}
header .logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-content:center;font-weight:700;color:#0a0a0f;font-size:15px}
header h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.02em}
header .sub{font-size:11px;color:var(--muted);font-weight:500}
header .icon-btn{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-content:center;color:var(--muted);font-size:18px}
header .icon-btn:active{background:var(--elev)}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
#chat-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 12px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:92%;display:grid;gap:6px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-end}
.msg.bot{align-self:flex-start}
.msg .bubble{padding:12px 14px;border-radius:18px;font-size:15.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:linear-gradient(135deg,#4c1d95,#6d28d9);border-bottom-right-radius:6px}
.msg.bot .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg .meta{font-size:11px;color:var(--muted);padding:0 4px}
.msg.user .meta{text-align:right}
.msg.bot.streaming .bubble::after{content:"";display:inline-block;width:7px;height:1.1em;background:var(--accent2);margin-left:3px;vertical-align:text-bottom;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.welcome{margin:auto 0;text-align:center;padding:24px 12px;display:grid;gap:14px;max-width:360px;align-self:center}
.welcome h2{margin:0;font-size:26px;letter-spacing:-.03em}
.welcome p{margin:0;color:var(--muted);font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:10px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--text)}
.chip:active{border-color:var(--accent);color:var(--accent)}
.composer{flex:0 0 auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(10,10,15,.92);backdrop-filter:blur(14px);display:grid;gap:8px}
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:0 0 auto;padding:8px 12px;border-radius:999px;background:var(--elev);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.quick button:active{color:var(--accent);border-color:var(--accent)}
.row-in{display:flex;gap:8px;align-items:flex-end}
.row-in textarea{flex:1;min-height:44px;max-height:120px;resize:none;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;line-height:1.4;font-size:16px}
.row-in textarea:focus{outline:none;border-color:var(--accent)}
.send{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;display:grid;place-content:center;font-size:18px;flex:0 0 auto}
.send:disabled{opacity:.4}
#v-set{overflow-y:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
#v-set h2{margin:0 0 4px;font-size:24px;letter-spacing:-.03em}
#v-set .lead{color:var(--muted);font-size:14px;margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:12px;margin-bottom:14px}
.card label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.card label span.help{font-weight:400;opacity:.85}
.card input, .card select{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;width:100%}
.card input:focus, .card select:focus{outline:none;border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 16px;border-radius:14px;font-weight:600;font-size:15px;background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff}
.btn.alt{background:var(--elev);border:1px solid var(--line);color:var(--text)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:14px;min-height:44px}
.btn.danger{color:var(--hot);border-color:rgba(251,113,133,.35)}
.status{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;background:var(--elev);color:var(--muted);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.08)}
.pill.warn{color:#fbbf24;border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.08)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.hint{font-size:12px;color:var(--muted);line-height:1.45;margin:0}
.err{color:var(--hot);font-size:13px;white-space:pre-wrap}
.okmsg{color:var(--ok);font-size:13px}
</style>
</head>
<body>
<div id="lock">
  <div class="mark">P</div>
  <h1>Pulse</h1>
  <p id="lockmsg">Pick a short passcode. This stays on your phone.</p>
  <input id="pass" type="password" inputmode="text" autocomplete="off" placeholder="Passcode" aria-label="Passcode">
  <button class="btn" id="unlock" type="button">Enter</button>
</div>
<div class="shell" id="app" hidden>
  <header>
    <div class="brand">
      <div class="logo">P</div>
      <div>
        <h1 id="hdr-title">Pulse</h1>
        <div class="sub" id="hdr-sub">Creative GPT</div>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" id="btn-new" type="button" title="New chat" aria-label="New chat">+</button>
      <button class="icon-btn" id="btn-set" type="button" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </header>
  <section class="view on" id="v-chat">
    <div id="chat-scroll"></div>
    <div class="composer">
      <div class="quick" id="quick">
        <button type="button" data-q="Give me 5 wild short-form video ideas for tonight.">Video ideas</button>
        <button type="button" data-q="Write a punchy Instagram caption for a neon city night drive.">Caption</button>
        <button type="button" data-q="Turn this into a 15-second reel script with hook, beat, and CTA: ">Reel script</button>
        <button type="button" data-q="Brainstorm a weird product name and one-line pitch.">Name it</button>
        <button type="button" data-q="Roast my idea gently, then make it 10× more interesting: ">Upgrade</button>
      </div>
      <div class="row-in">
        <textarea id="input" rows="1" placeholder="Message Pulse…" enterkeyhint="send"></textarea>
        <button class="send" id="send" type="button" aria-label="Send">↑</button>
      </div>
    </div>
  </section>
  <section class="view" id="v-set">
    <h2>Settings</h2>
    <p class="lead">Pulse runs on open models via your Hugging Face token. Nothing is stored on our servers.</p>
    <div class="status">
      <span class="pill" id="pill-tok"><span class="dot"></span> Token</span>
      <span class="pill" id="pill-model"><span class="dot"></span> Model</span>
    </div>
    <div class="card">
      <label>Hugging Face token
        <span class="help">Free · starts with hf_ · used for Inference API</span>
        <input id="tok" type="password" placeholder="hf_…" autocomplete="off" autocapitalize="off">
      </label>
      <label>Model
        <span class="help">Pick a fast instruct model</span>
        <select id="model">
          <option value="Qwen/Qwen2.5-7B-Instruct">Qwen2.5 7B (balanced)</option>
          <option value="meta-llama/Meta-Llama-3.1-8B-Instruct">Llama 3.1 8B</option>
          <option value="mistralai/Mistral-7B-Instruct-v0.3">Mistral 7B</option>
          <option value="HuggingFaceH4/zephyr-7b-beta">Zephyr 7B</option>
          <option value="google/gemma-2-9b-it">Gemma 2 9B</option>
        </select>
      </label>
      <button class="btn" id="save" type="button">Save</button>
      <button class="btn alt" id="test" type="button">Test connection</button>
      <div id="set-msg" class="hint"></div>
    </div>
    <div class="card">
      <p class="hint">Personality: sharp, playful, useful — built for short-form creative work (scripts, captions, ideas).</p>
      <button class="btn ghost" id="back" type="button">← Back to chat</button>
      <button class="btn ghost danger" id="wipe" type="button">Clear chat history</button>
    </div>
  </section>
</div>
<script type="module">
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const LS=k=>localStorage.getItem(k)||"";
const SYSTEM = `You are Pulse, a creative GPT for phones. You help with short-form ideas, reel scripts, captions, names, hooks, and weird delightful riffs.
Style: concise, vivid, human. Prefer short paragraphs and bullet lists when useful. Avoid filler and corporate tone.
When asked for scripts, use clear structure (Hook / Beats / CTA). When asked for options, give 4–6 strong ones.
Never claim you generated video or images unless the user is only brainstorming. You are a text creative partner.`;
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("pulse:"+t)))].map(b=>b.toString(16).padStart(2,"0")).join("");
async function lockInit(){
  if(sessionStorage.pulse_ok==="1"){showApp();return}
  if(LS("pulse_ph"))$("#lockmsg").textContent="Welcome back — enter your passcode.";
  $("#unlock").onclick=async()=>{
    const v=$("#pass").value; if(!v)return;
    const h=await sha(v);
    if(!LS("pulse_ph"))localStorage.pulse_ph=h;
    else if(LS("pulse_ph")!==h){$("#lockmsg").textContent="Wrong passcode.";return}
    sessionStorage.pulse_ok="1";showApp();
  };
  $("#pass").addEventListener("keydown",e=>{if(e.key==="Enter")$("#unlock").click()});
}
function showApp(){$("#lock").remove();$("#app").hidden=false;renderChat();refreshPills()}
const dbp=new Promise((res,rej)=>{const r=indexedDB.open("pulse",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("msgs",{keyPath:"id",autoIncrement:true});
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(mode,fn)=>{const d=await dbp;return new Promise((res,rej)=>{const t=d.transaction("msgs",mode);const s=t.objectStore("msgs");const q=fn(s);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
const saveMsg=m=>tx("readwrite",s=>s.add(m));
const allMsgs=async()=>await tx("readonly",s=>s.getAll())||[];
const clearMsgs=()=>tx("readwrite",s=>s.clear());
let messages=[];
let busy=false;
function showView(id){
  $$(".view").forEach(v=>v.classList.toggle("on",v.id===id));
  $("#hdr-title").textContent=id==="v-set"?"Settings":"Pulse";
  $("#hdr-sub").textContent=id==="v-set"?"Token & model":"Creative GPT";
  if(id==="v-set")refreshPills();
}
$("#btn-set").onclick=()=>showView("v-set");
$("#back").onclick=()=>showView("v-chat");
$("#btn-new").onclick=async()=>{
  if(busy)return;
  if(messages.length && !confirm("Start a new chat?"))return;
  messages=[]; await clearMsgs(); renderChat();
};
function renderChat(){
  const el=$("#chat-scroll");
  if(!messages.length){
    el.innerHTML=`<div class="welcome"><h2>What are we making?</h2><p>Scripts, captions, names, wild ideas — type below or tap a starter.</p><div class="chips"><button class="chip" type="button" data-q="5 surreal reel concepts set in a flooded mall at night">Flooded mall reels</button><button class="chip" type="button" data-q="Write a 12-second hook + payoff for a cooking fail comedy reel">Cooking fail</button><button class="chip" type="button" data-q="Give me a brand voice for a chaotic neon soda startup">Brand voice</button></div></div>`;
    el.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>send(b.dataset.q));
    return;
  }
  el.innerHTML="";
  for(const m of messages){
    const d=document.createElement("div");
    d.className="msg "+(m.role==="user"?"user":"bot");
    d.innerHTML=`<div class="bubble"></div><div class="meta">${m.role==="user"?"You":"Pulse"}</div>`;
    d.querySelector(".bubble").textContent=m.content;
    el.append(d);
  }
  el.scrollTop=el.scrollHeight;
}
function appendStreaming(){
  const el=$("#chat-scroll");
  const welcome=el.querySelector(".welcome"); if(welcome)welcome.remove();
  const d=document.createElement("div");
  d.className="msg bot streaming"; d.id="stream-msg";
  d.innerHTML=`<div class="bubble"></div><div class="meta">Pulse</div>`;
  el.append(d); el.scrollTop=el.scrollHeight;
  return d.querySelector(".bubble");
}
const DEFAULT_MODEL="Qwen/Qwen2.5-7B-Instruct";
function loadSet(){$("#tok").value=LS("pulse_tok");$("#model").value=LS("pulse_model")||DEFAULT_MODEL}
function refreshPills(){
  const tok=LS("pulse_tok").trim().startsWith("hf_");
  const model=(LS("pulse_model")||DEFAULT_MODEL).split("/").pop();
  const pt=$("#pill-tok"), pm=$("#pill-model");
  pt.className="pill "+(tok?"ok":"warn");
  pt.innerHTML=`<span class="dot"></span> ${tok?"Token ready":"Add token"}`;
  pm.className="pill ok";
  pm.innerHTML=`<span class="dot"></span> ${model}`;
}
$("#save").onclick=()=>{
  localStorage.pulse_tok=$("#tok").value.trim();
  localStorage.pulse_model=$("#model").value;
  $("#set-msg").className="okmsg";
  $("#set-msg").textContent="Saved on this phone.";
  refreshPills();
};
$("#test").onclick=async()=>{
  $("#set-msg").className="hint";$("#set-msg").textContent="Testing…";
  try{
    const out=await complete([{role:"user",content:"Say hi in five words."}],{max_tokens:32});
    $("#set-msg").className="okmsg";$("#set-msg").textContent="Connected: "+(out||"").slice(0,80);
  }catch(e){$("#set-msg").className="err";$("#set-msg").textContent=String(e.message||e)}
};
$("#wipe").onclick=async()=>{
  if(!confirm("Clear all chat messages on this phone?"))return;
  messages=[]; await clearMsgs(); renderChat(); showView("v-chat");
};
loadSet();
async function complete(chatMessages, opts={}){
  const tok=LS("pulse_tok").trim();
  if(!tok.startsWith("hf_"))throw new Error("Add your Hugging Face token in Settings (starts with hf_).");
  const model=LS("pulse_model")||DEFAULT_MODEL;
  const body={model,messages:[{role:"system",content:SYSTEM},...chatMessages],max_tokens:opts.max_tokens||700,temperature:opts.temperature??0.85,stream:false};
  const endpoints=["https://router.huggingface.co/v1/chat/completions","https://api-inference.huggingface.co/v1/chat/completions"];
  let lastErr;
  for(const url of endpoints){
    try{
      const r=await fetch(url,{method:"POST",headers:{"Authorization":"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify(body)});
      const t=await r.text(); let data; try{data=JSON.parse(t)}catch{data={raw:t}}
      if(!r.ok){const msg=data.error&&(data.error.message||data.error)||data.raw||r.statusText;lastErr=new Error(typeof msg==="string"?msg:JSON.stringify(msg));continue}
      const text=data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content;
      if(text)return text.trim();
      if(Array.isArray(data)&&data[0]&&data[0].generated_text)return String(data[0].generated_text).trim();
      if(data.generated_text)return String(data.generated_text).trim();
      lastErr=new Error("Empty model response");
    }catch(e){lastErr=e}
  }
  try{
    const r=await fetch("https://api-inference.huggingface.co/models/"+encodeURIComponent(model),{method:"POST",headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify({inputs:SYSTEM+"\n\nUser: "+chatMessages[chatMessages.length-1].content+"\nAssistant:",parameters:{max_new_tokens:opts.max_tokens||700,temperature:0.85,return_full_text:false}})});
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||r.statusText);
    if(Array.isArray(data)&&data[0]&&data[0].generated_text)return String(data[0].generated_text).trim();
    if(data.generated_text)return String(data.generated_text).trim();
    throw new Error("Unexpected response");
  }catch(e){throw lastErr||e}
}
async function completeStream(chatMessages, onDelta){
  const tok=LS("pulse_tok").trim();
  if(!tok.startsWith("hf_"))throw new Error("Add your Hugging Face token in Settings (starts with hf_).");
  const model=LS("pulse_model")||DEFAULT_MODEL;
  const body={model,messages:[{role:"system",content:SYSTEM},...chatMessages],max_tokens:700,temperature:0.85,stream:true};
  const r=await fetch("https://router.huggingface.co/v1/chat/completions",{method:"POST",headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok||!r.body){const text=await complete(chatMessages);onDelta(text);return text}
  const reader=r.body.getReader(); const dec=new TextDecoder(); let full="",buf="";
  while(true){
    const {done,value}=await reader.read(); if(done)break;
    buf+=dec.decode(value,{stream:true}); const lines=buf.split("\n"); buf=lines.pop()||"";
    for(const line of lines){
      const s=line.trim(); if(!s.startsWith("data:"))continue;
      const payload=s.slice(5).trim(); if(payload==="[DONE]")continue;
      try{const j=JSON.parse(payload); const d=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content; if(d){full+=d;onDelta(full)}}catch{}
    }
  }
  if(!full){full=await complete(chatMessages);onDelta(full)}
  return full.trim();
}
async function send(text){
  text=(text||"").trim(); if(!text||busy)return;
  if(!LS("pulse_tok").trim().startsWith("hf_")){showView("v-set");$("#set-msg").className="err";$("#set-msg").textContent="Add your hf_ token and tap Save, then come back.";return}
  busy=true; $("#send").disabled=true; $("#input").value=""; autoSize($("#input"));
  messages.push({role:"user",content:text}); await saveMsg({role:"user",content:text,ts:Date.now()}); renderChat();
  const bubble=appendStreaming();
  try{
    const history=messages.map(m=>({role:m.role,content:m.content}));
    const out=await completeStream(history, t=>{bubble.textContent=t; const sc=$("#chat-scroll");sc.scrollTop=sc.scrollHeight});
    const streamEl=$("#stream-msg"); if(streamEl)streamEl.classList.remove("streaming");
    messages.push({role:"assistant",content:out}); await saveMsg({role:"assistant",content:out,ts:Date.now()}); renderChat();
  }catch(e){
    const streamEl=$("#stream-msg"); if(streamEl)streamEl.remove();
    messages.push({role:"assistant",content:"⚠️ "+(e.message||e)}); renderChat();
  }
  busy=false; $("#send").disabled=false;
}
function autoSize(ta){ta.style.height="auto";ta.style.height=Math.min(120,Math.max(44,ta.scrollHeight))+"px"}
$("#input").addEventListener("input",e=>autoSize(e.target));
$("#input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send($("#input").value)}});
$("#send").onclick=()=>send($("#input").value);
$$("#quick [data-q]").forEach(b=>b.onclick=()=>{const q=b.dataset.q;if(q.endsWith(": ")||q.endsWith(":")){$("#input").value=q;$("#input").focus();autoSize($("#input"))}else send(q)});
(async()=>{try{const stored=await allMsgs();messages=stored.map(m=>({role:m.role,content:m.content}))}catch{}lockInit()})();
